name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests
      - run: agent-runbook-linter examples/healthy-repo --check warning
      - run: agent-runbook-linter examples/problem-repo --format sarif --output reports/agent-runbook.sarif
      - run: python -m json.tool reports/agent-runbook.sarif > /dev/null
      - run: agent-runbook-linter examples/problem-repo --write-baseline reports/agent-runbook-baseline.json
      - run: python -m json.tool reports/agent-runbook-baseline.json > /dev/null
      - run: agent-runbook-linter examples/problem-repo --baseline reports/agent-runbook-baseline.json --check warning --format json --output reports/agent-runbook-filtered.json
      - run: python -m json.tool reports/agent-runbook-filtered.json > /dev/null
